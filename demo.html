<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TalkToYourData - Voice Demo</title>
    <script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 800px;
            width: 100%;
            padding: 40px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 32px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 16px;
        }

        .login-section, .chat-section {
            display: none;
        }

        .login-section.active, .chat-section.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px 32px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .status {
            text-align: center;
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
            background: #f5f5f5;
        }

        .status.connected {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .status.error {
            background: #ffebee;
            color: #c62828;
        }

        .transcript-container {
            margin-top: 30px;
            padding: 20px;
            background: #f9f9f9;
            border-radius: 8px;
            max-height: 400px;
            overflow-y: auto;
        }

        .transcript-message {
            margin-bottom: 15px;
            padding: 12px;
            border-radius: 8px;
            line-height: 1.5;
        }

        .transcript-message.user {
            background: #e3f2fd;
            margin-left: 40px;
        }

        .transcript-message.agent {
            background: #f3e5f5;
            margin-right: 40px;
        }

        .transcript-message .speaker {
            font-weight: 600;
            margin-bottom: 5px;
            font-size: 14px;
        }

        .transcript-message.user .speaker {
            color: #1976d2;
        }

        .transcript-message.agent .speaker {
            color: #7b1fa2;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .controls button {
            flex: 1;
        }

        .mic-indicator {
            width: 20px;
            height: 20px;
            background: #4caf50;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
            animation: pulse 1.5s ease-in-out infinite;
        }

        .mic-indicator.muted {
            background: #f44336;
            animation: none;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .error-message {
            color: #c62828;
            margin-top: 10px;
            font-size: 14px;
        }

        .info-box {
            background: #fff3cd;
            border: 1px solid #ffc107;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .info-box strong {
            display: block;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎤 TalkToYourData</h1>
        <p class="subtitle">Voice-native document Q&A assistant</p>

        <!-- Login Section -->
        <div class="login-section active">
            <div class="info-box">
                <strong>Demo Instructions:</strong>
                <p>1. First, register/login to get an account</p>
                <p>2. Upload some documents via the API (or use existing ones)</p>
                <p>3. Click "Connect to Voice Agent" to start talking to your documents</p>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="your@email.com" value="demo@example.com">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Password" value="password123">
            </div>

            <button id="loginBtn">Login / Register</button>
            <div id="loginError" class="error-message"></div>
        </div>

        <!-- Chat Section -->
        <div class="chat-section">
            <div class="status" id="status">
                <span id="statusIcon"></span>
                <span id="statusText">Initializing...</span>
            </div>

            <div class="controls">
                <button id="connectBtn">
                    <span class="mic-indicator" id="micIndicator"></span>
                    Connect to Voice Agent
                </button>
                <button id="disconnectBtn" disabled>Disconnect</button>
            </div>

            <div class="transcript-container" id="transcript">
                <p style="text-align: center; color: #999;">Transcript will appear here...</p>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000/api/v1';
        
        let accessToken = null;
        let room = null;
        let livekitToken = null;
        let transcripts = [];

        // DOM Elements
        const loginSection = document.querySelector('.login-section');
        const chatSection = document.querySelector('.chat-section');
        const loginBtn = document.getElementById('loginBtn');
        const connectBtn = document.getElementById('connectBtn');
        const disconnectBtn = document.getElementById('disconnectBtn');
        const statusDiv = document.getElementById('status');
        const statusText = document.getElementById('statusText');
        const statusIcon = document.getElementById('statusIcon');
        const transcriptDiv = document.getElementById('transcript');
        const micIndicator = document.getElementById('micIndicator');
        const loginError = document.getElementById('loginError');

        // Login/Register
        loginBtn.addEventListener('click', async () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            loginError.textContent = '';
            loginBtn.disabled = true;
            loginBtn.textContent = 'Logging in...';

            try {
                // Try to login first
                let response = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                // If login fails, try to register
                if (!response.ok) {
                    console.log('Login failed, trying to register...');
                    response = await fetch(`${API_BASE}/auth/register`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email, password })
                    });

                    if (!response.ok) {
                        throw new Error('Registration failed');
                    }

                    // Now login with the new account
                    response = await fetch(`${API_BASE}/auth/login`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email, password })
                    });
                }

                const data = await response.json();
                accessToken = data.access_token;

                // Switch to chat section
                loginSection.classList.remove('active');
                chatSection.classList.add('active');
                updateStatus('Ready to connect', 'info');

            } catch (error) {
                console.error('Login error:', error);
                loginError.textContent = 'Login/Registration failed. Please try again.';
            } finally {
                loginBtn.disabled = false;
                loginBtn.textContent = 'Login / Register';
            }
        });

        // Connect to LiveKit
        connectBtn.addEventListener('click', async () => {
            if (!accessToken) return;

            connectBtn.disabled = true;
            connectBtn.textContent = 'Connecting...';
            updateStatus('Getting LiveKit token...', 'info');

            try {
                // Get LiveKit token
                const response = await fetch(`${API_BASE}/livekit/token`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${accessToken}`
                    },
                    body: JSON.stringify({ room_name: `room-${Date.now()}` })
                });

                if (!response.ok) {
                    throw new Error('Failed to get LiveKit token');
                }

                const data = await response.json();
                livekitToken = data.token;
                const wsUrl = data.url;

                updateStatus('Connecting to room...', 'info');

                // Connect to LiveKit room
                room = new LiveKit.Room();

                // Set up event listeners
                room.on(LiveKit.RoomEvent.Connected, () => {
                    console.log('Connected to room');
                    updateStatus('Connected! Agent will join shortly...', 'connected');
                    connectBtn.textContent = 'Connected';
                    disconnectBtn.disabled = false;
                    micIndicator.classList.remove('muted');
                });

                room.on(LiveKit.RoomEvent.Disconnected, () => {
                    console.log('Disconnected from room');
                    updateStatus('Disconnected', 'error');
                    connectBtn.disabled = false;
                    connectBtn.textContent = 'Connect to Voice Agent';
                    disconnectBtn.disabled = true;
                    micIndicator.classList.add('muted');
                });

                room.on(LiveKit.RoomEvent.ParticipantConnected, (participant) => {
                    console.log('Participant connected:', participant.identity);
                    if (participant.identity.includes('agent')) {
                        updateStatus('Voice agent connected! Start speaking...', 'connected');
                    }
                });

                room.on(LiveKit.RoomEvent.TrackSubscribed, (track, publication, participant) => {
                    if (track.kind === LiveKit.Track.Kind.Audio) {
                        const audioElement = track.attach();
                        document.body.appendChild(audioElement);
                    }
                });

                room.on(LiveKit.RoomEvent.DataReceived, (payload, participant) => {
                    const decoder = new TextDecoder();
                    const data = JSON.parse(decoder.decode(payload));
                    
                    // Handle transcription data if sent
                    if (data.transcript) {
                        addTranscript(data.speaker || 'agent', data.transcript);
                    }
                });

                // Connect to the room
                await room.connect(wsUrl, livekitToken);

                // Enable microphone
                await room.localParticipant.setMicrophoneEnabled(true);

            } catch (error) {
                console.error('Connection error:', error);
                updateStatus('Connection failed: ' + error.message, 'error');
                connectBtn.disabled = false;
                connectBtn.textContent = 'Retry Connection';
            }
        });

        // Disconnect
        disconnectBtn.addEventListener('click', async () => {
            if (room) {
                await room.disconnect();
                room = null;
            }
        });

        // Helper functions
        function updateStatus(message, type = 'info') {
            statusText.textContent = message;
            statusDiv.className = 'status';
            if (type === 'connected') {
                statusDiv.classList.add('connected');
                statusIcon.textContent = '✓ ';
            } else if (type === 'error') {
                statusDiv.classList.add('error');
                statusIcon.textContent = '✗ ';
            } else {
                statusIcon.textContent = '';
            }
        }

        function addTranscript(speaker, text) {
            transcripts.push({ speaker, text, time: new Date() });
            
            const messageDiv = document.createElement('div');
            messageDiv.className = `transcript-message ${speaker}`;
            messageDiv.innerHTML = `
                <div class="speaker">${speaker === 'user' ? 'You' : 'Agent'}</div>
                <div>${text}</div>
            `;
            
            if (transcriptDiv.children[0]?.textContent.includes('Transcript will appear')) {
                transcriptDiv.innerHTML = '';
            }
            
            transcriptDiv.appendChild(messageDiv);
            transcriptDiv.scrollTop = transcriptDiv.scrollHeight;
        }
    </script>
</body>
</html>
